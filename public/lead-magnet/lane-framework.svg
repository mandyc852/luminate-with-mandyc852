<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=Poppins:wght@300;400;500&amp;display=swap');
      .letter { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-style: italic; fill: #C9A227; }
      .section-name { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; fill: #FAF9F7; letter-spacing: 0.3em; }
      .section-desc { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; fill: #B8B5A8; letter-spacing: 0.05em; }
    </style>
    <marker id="lane-arrow-svg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9A227" />
    </marker>
  </defs>

  <!-- Decorative inner spokes (4 cardinal axes) -->
  <g stroke="#FAF9F7" stroke-opacity="0.05" stroke-width="0.5">
    <line x1="300" y1="150" x2="300" y2="450" />
    <line x1="150" y1="300" x2="450" y2="300" />
  </g>

  <!-- Inner decorative circle -->
  <circle cx="300" cy="300" r="140" fill="none" stroke="#FAF9F7" stroke-opacity="0.06" stroke-width="0.5" />

  <!-- Main ring -->
  <circle cx="300" cy="300" r="200" fill="none" stroke="#C9A227" stroke-opacity="0.55" stroke-width="1" />

  <!-- Flow arcs at the four diagonal positions (NE, SE, SW, NW) — quarter-arcs along the ring, clockwise -->
  <!-- L (top) -> A (right) arc, with arrowhead approaching A -->
  <path d="M 410 132 A 200 200 0 0 1 468 190" stroke="#C9A227" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-svg)" stroke-linecap="round" />
  <!-- A (right) -> N (bottom) arc -->
  <path d="M 468 410 A 200 200 0 0 1 410 468" stroke="#C9A227" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-svg)" stroke-linecap="round" />
  <!-- N (bottom) -> E (left) arc -->
  <path d="M 190 468 A 200 200 0 0 1 132 410" stroke="#C9A227" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-svg)" stroke-linecap="round" />
  <!-- E (left) -> L (top) arc -->
  <path d="M 132 190 A 200 200 0 0 1 190 132" stroke="#C9A227" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-svg)" stroke-linecap="round" />

  <!-- Center dot -->
  <circle cx="300" cy="300" r="2.5" fill="#C9A227" />

  <!-- L — Top (12 o'clock) -->
  <g>
    <text x="300" y="120" text-anchor="middle" class="letter" font-size="64">L</text>
    <text x="300" y="158" text-anchor="middle" class="section-name" font-size="9" style="text-transform: uppercase;">LOOKBACK</text>
    <text x="300" y="174" text-anchor="middle" class="section-desc" font-size="8">what happened</text>
  </g>

  <!-- A — Right (3 o'clock) -->
  <g>
    <text x="500" y="318" text-anchor="middle" class="letter" font-size="64">A</text>
    <text x="500" y="354" text-anchor="middle" class="section-name" font-size="9" style="text-transform: uppercase;">ANCHOR</text>
    <text x="500" y="370" text-anchor="middle" class="section-desc" font-size="8">what I'm holding</text>
  </g>

  <!-- N — Bottom (6 o'clock) -->
  <g>
    <text x="300" y="520" text-anchor="middle" class="letter" font-size="64">N</text>
    <text x="300" y="558" text-anchor="middle" class="section-name" font-size="9" style="text-transform: uppercase;">NEXT</text>
    <text x="300" y="574" text-anchor="middle" class="section-desc" font-size="8">what's coming</text>
  </g>

  <!-- E — Left (9 o'clock) -->
  <g>
    <text x="100" y="318" text-anchor="middle" class="letter" font-size="64">E</text>
    <text x="100" y="354" text-anchor="middle" class="section-name" font-size="9" style="text-transform: uppercase;">ENVISION</text>
    <text x="100" y="370" text-anchor="middle" class="section-desc" font-size="8">the bigger picture</text>
  </g>
</svg>
